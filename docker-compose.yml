services:
  postgres:
    image: postgres:16

    container_name: rtc_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: realtime_chat

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server

    container_name: rtc_server

    restart: unless-stopped

    env_file:
      - ./server/.env.docker

    ports:
      - "5000:5000"

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}

    container_name: rtc_client

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - server

volumes:
  postgres_data:
  uploads_data:
